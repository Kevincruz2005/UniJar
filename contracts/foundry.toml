[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../.deps"]
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=../.deps/forge-std/src/", "tjar/=../.deps/tjar/src/", "v4-core/=../.deps/tjar/lib/v4-core/src/", "solmate/=../.deps/tjar/lib/solmate/"]
fs_permissions = [{ access = "read", path = "../oracle-contracts/out" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false
